name: Gerar APK ODRANOEL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          echo "Arquivos do repositorio:"
          ls -lah
          echo "ZIPs encontrados:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

      - name: Extrair projeto
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "ODRANOEL-Android.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ODRANOEL-Android.zip nao foi encontrado."
            echo "ZIPs disponiveis:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p projeto

          echo "Testando ZIP..."
          unzip -t "$ZIP"

          echo "Extraindo ZIP..."
          unzip -o "$ZIP" -d projeto

          echo "Projeto extraido:"
          find projeto -maxdepth 5 -type f -print

      - name: Encontrar projeto Android
        id: android
        run: |
          ROOT=$(find projeto -type f -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERRO: projeto Android nao encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: ${{ steps.android.outputs.root }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          echo "APKs encontrados:"
          find projeto -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ODRANOEL-APK-${{ github.run_number }}
          path: projeto/**/*.
