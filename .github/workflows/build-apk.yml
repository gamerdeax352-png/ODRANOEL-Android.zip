name: Gerar APK ODRANOEL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -o ODRANOEL-Android.zip -d projeto

      - name: Localizar projeto
        run: |
          echo "Procurando settings.gradle.kts..."
          find projeto -type f -name "settings.gradle.kts" -print

          echo "Procurando settings.gradle..."
          find projeto -type f -name "settings.gradle" -print

      - name: Gerar APK
        run: |
          if [ -f "projeto/settings.gradle.kts" ]; then
            cd projeto
          else
            DIR=$(dirname "$(find projeto -type f -name "settings.gradle.kts" -print -quit)")
            cd "$DIR"
          fi

          echo "Projeto encontrado em:"
          pwd

          gradle assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          echo "APKs encontrados:"
          find projeto -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ODRANOEL-APK-${{ github.run_number }}
          path: projeto/**/*.apk
          if-no-files-found: error
          echo "Testando ZIP..."
          unzip -t "$ZIP"

          echo "Extraindo ZIP..."
          unzip -o "$ZIP" -d projeto

          echo "Projeto extraido:"
          find projeto -maxdepth 5 -type f -print

      - name: Encontrar projeto Android
        id: android
        run: |
          ROOT=$(find projeto -type f -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERRO: projeto Android nao encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: ${{ steps.android.outputs.root }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          echo "APKs encontrados:"
          find projeto -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ODRANOEL-APK-${{ github.run_number }}
          path: projeto/**/*.
